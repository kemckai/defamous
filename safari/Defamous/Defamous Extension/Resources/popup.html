<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      max-height: 600px;
      overflow-y: auto;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1877f2;
    }
    
    .setting {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    label {
      font-size: 14px;
      color: #333;
      cursor: pointer;
      flex: 1;
    }
    
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background-color: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .toggle.active {
      background-color: #1877f2;
    }
    
    .toggle::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: white;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }
    
    .toggle.active::after {
      transform: translateX(20px);
    }
    
    input[type="number"] {
      width: 80px;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    
    .status {
      padding: 8px;
      background-color: #e3f2fd;
      border-radius: 4px;
      font-size: 12px;
      color: #1976d2;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Defamous</h1>
  
  <div class="setting">
    <label for="hideVerified">Hide Verified Accounts</label>
    <div class="toggle" id="toggleVerified"></div>
  </div>
  
  <div class="setting">
    <label for="hidePublicFigures">Hide Public Figures</label>
    <div class="toggle" id="togglePublicFigures"></div>
  </div>
  
  <div class="setting">
    <label for="hideBrandPages">Hide Brand Pages</label>
    <div class="toggle" id="toggleBrandPages"></div>
  </div>
  
  <div class="setting">
    <label for="hideTrending">Hide Trending Content</label>
    <div class="toggle" id="toggleTrending"></div>
  </div>
  
  <div class="setting">
    <label for="hideHighEngagement">Hide High Engagement Posts</label>
    <div class="toggle" id="toggleHighEngagement"></div>
  </div>
  
  <div class="setting">
    <label for="engagementThreshold">Engagement Threshold:</label>
    <input type="number" id="engagementThreshold" min="0" step="1000" value="10000">
  </div>
  <div class="info">Posts with more than this many likes/comments/shares will be hidden</div>
  
  <hr style="margin: 16px 0; border: none; border-top: 1px solid #ddd;">
  
  <div class="setting">
    <label for="hideSharedFromPages">Hide Posts Shared from Pages</label>
    <div class="toggle" id="toggleSharedFromPages"></div>
  </div>
  
  <div class="setting">
    <label for="hideSharedFromGroups">Hide Posts Shared from Groups</label>
    <div class="toggle" id="toggleSharedFromGroups"></div>
  </div>
  
  <div class="setting">
    <label for="filterSharedCelebrityContent">Filter Celebrity Content in Shared Posts</label>
    <div class="toggle" id="toggleSharedCelebrityContent"></div>
  </div>
  <div class="info">Hides shared posts that contain celebrity-related content, even if shared by friends</div>
  
  <div class="status" id="status">Settings saved automatically</div>
  
  <script src="popup.js"></script>
</body>
</html>
