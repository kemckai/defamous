<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>defaults</title>
</head>
<body>
  <div role="feed" id="feed">
    <div role="article" data-testid="default-celebrity">
      <a role="link" href="https://www.facebook.com/TaylorSwift"><span>Taylor Swift</span></a>
      <div data-ad-preview="message">Album announcement for Friday.</div>
    </div>
    <div role="article" data-testid="default-verified-friend">
      <a role="link" href="https://www.facebook.com/alex.doe"><span>Alex Doe</span></a>
      <span aria-label="Verified account" role="img"></span>
      <div data-ad-preview="message">Picked up the kids and made pasta.</div>
    </div>
    <div role="article" data-testid="default-popular-friend">
      <a role="link" href="https://www.facebook.com/robin.lee"><span>Robin Lee</span></a>
      <div data-ad-preview="message">The school bake sale raised enough for the field trip.</div>
      <div aria-label="40,000 Likes">40,000 Likes</div>
    </div>
  </div>
  <script src="/tests/support/mock-chrome.js"></script>
  <script src="/content.js"></script>
</body>
</html>
